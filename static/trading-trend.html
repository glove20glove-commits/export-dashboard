<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매매동향 모니터링</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:16px; }
        .card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
        .card .k { font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
        .card .v { font-size:24px; font-weight:700; }

        .panel { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
        .panel h3 { margin:0 0 12px 0; font-size:16px; }
        .grid { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; }
        @media (max-width: 900px) { .grid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 600px) { .grid { grid-template-columns:1fr; } }

        .input, .textarea, .select { width:100%; border:1px solid var(--border); border-radius:10px; padding:9px 10px; font-size:14px; }
        .textarea { min-height:72px; resize:vertical; }
        .actions { margin-top:10px; display:flex; gap:8px; }

        table { width:100%; border-collapse:collapse; }
        th, td { border-bottom:1px solid var(--border); text-align:left; padding:10px 8px; font-size:13px; vertical-align:top; }
        th { color:var(--text-secondary); font-weight:600; }
        .mono { font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        .right { text-align:right; }
        .muted { color:var(--text-secondary); }
        .pos { color:#16a34a; font-weight:600; }
        .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
        .hint { color:var(--text-secondary); font-size:12px; }
        .suggest-wrap { width:100%; }
        .stock-chip {
            display:inline-flex; align-items:center; gap:6px; margin:4px 6px 0 0;
            border:1px solid var(--border); background:#fff; border-radius:999px; padding:8px 12px; cursor:pointer;
        }
        .stock-chip:hover { background:#f8fafc; }
    </style>
</head>
<body>
<header>
    <div class="header-top">
        <div class="nav-tabs">
            <div class="nav-group">
                <span class="nav-group-label">시장</span>
                <a href="/market" class="nav-tab">국내</a>
                <a href="/us-market" class="nav-tab">미국</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-label">수출</span>
                <a href="/" class="nav-tab">기업</a>
                <a href="/industry" class="nav-tab">산업</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-label">참고 데이터</span>
                <a href="/carbon" class="nav-tab">탄소배출권</a>
                <a href="/tourism" class="nav-tab">관광</a>
                <a href="/headcount" class="nav-tab">인원</a>
                    <a href="/usdc" class="nav-tab">USDC</a>
                    <a href="/deposit-fund" class="nav-tab">예탁금</a>
                    <a href="/semiconductor-prices" class="nav-tab">반도체가격</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-label">개별 종목 데이터</span>
                <a href="/trading-trend" class="nav-tab active">매매동향</a>
                <a href="/quarterly-performance" class="nav-tab">분기실적</a>
                <a href="/stock-monitor" class="nav-tab">종목주가</a>
                <a href="/disclosure-compare" class="nav-tab">공시비교</a>
                <a href="/overhang" class="nav-tab">오버행 현황</a>
            </div>
            <div class="nav-group">
                <span class="nav-group-label">모니터링</span>
                <a href="/youtube" class="nav-tab">유튜브</a>
                <a href="/blog" class="nav-tab">블로그</a>
            </div>
            <span class="nav-spacer"></span>
            <a href="/visit" class="nav-tab">탐방</a>
        </div>
        <h1>매매동향 모니터링</h1>
    </div>
    <p class="subtitle">최근 특수관계인 지분 매수 종목 모니터링</p>
</header>

<main>
    <section class="cards" id="summary-cards"></section>

    <section class="panel">
        <h3>기록 추가</h3>
        <div class="grid">
            <div><label>공시일</label><input id="f-date" class="input" type="date"></div>
            <div><label>종목명</label><input id="f-company" class="input" placeholder="예: 삼성전자"></div>
            <div>
                <label>종목코드</label>
                <input id="f-code" class="input mono" placeholder="자동 입력 또는 직접 입력">
                <div id="f-stock-selected" class="hint" style="margin-top:4px;">선택: -</div>
                <div id="f-stock-resolve" class="hint" style="margin-top:4px;">저장 전 종목코드 자동확정: 대기</div>
            </div>
            <div><label>특수관계인</label><input id="f-party" class="input" placeholder="예: 홍길동"></div>
            <div><label>관계 구분</label><input id="f-relation" class="input" placeholder="예: 대표이사"></div>
            <div><label>매수주식수</label><input id="f-shares" class="input" type="number" value="0"></div>
            <div><label>지분변동(%p)</label><input id="f-ratio" class="input" type="number" step="0.001" value="0"></div>
            <div><label>평균단가(원)</label><input id="f-price" class="input" type="number" step="0.01" value="0"></div>
            <div><label>매수금액(원)</label><input id="f-amount" class="input" type="number" step="0.01" value="0"></div>
            <div><label>출처 제목</label><input id="f-source-title" class="input" placeholder="예: 임원·주요주주 특정증권등 소유상황보고서"></div>
            <div><label>출처 URL</label><input id="f-source-url" class="input" placeholder="https://..."></div>
            <div style="grid-column: span 2;"><label>메모</label><textarea id="f-note" class="textarea" placeholder="추가 코멘트"></textarea></div>
            <div style="grid-column: 1 / -1;">
                <div class="actions" style="margin-top:0;">
                    <button id="btn-search-stock" class="btn btn-secondary" type="button">종목 검색</button>
                </div>
                <div id="f-stock-suggest" class="suggest-wrap"></div>
            </div>
        </div>
        <div class="actions">
            <button id="btn-add" class="btn btn-primary">기록 추가</button>
            <button id="btn-reset" class="btn btn-secondary">초기화</button>
        </div>
    </section>

    <section class="panel">
        <h3>최근 매수 기록</h3>
        <div class="toolbar">
            <label>기간</label>
            <select id="q-days" class="select" style="width:130px;">
                <option value="7">최근 7일</option>
                <option value="30" selected>최근 30일</option>
                <option value="90">최근 90일</option>
                <option value="180">최근 180일</option>
                <option value="365">최근 1년</option>
            </select>
            <input id="q-keyword" class="input" style="max-width:260px;" placeholder="종목명/특수관계인/메모 검색">
            <input id="q-code" class="input mono" style="max-width:120px;" placeholder="종목코드">
            <button id="btn-search" class="btn btn-secondary">조회</button>
            <button id="btn-sync" class="btn btn-primary">DART 동기화</button>
        </div>
        <div class="desktop-only" style="overflow:auto;">
            <table>
                <thead>
                    <tr>
                        <th>공시일</th>
                        <th>종목</th>
                        <th>특수관계인</th>
                        <th class="right">매수주식수</th>
                        <th class="right">지분변동</th>
                        <th class="right">매수금액</th>
                        <th>출처</th>
                        <th>메모</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    <p>DART 자동수집 + 수동 보정 기반 모니터링</p>
</footer>

<script src="/static/trading-trend.js?v=20260402-3"></script>
</body>
</html>
