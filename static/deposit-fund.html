<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투자자 예탁금 모니터링</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        .period-btn {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .period-btn:hover { background: #f8fafc; }
        .period-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #eff6ff;
        }
        .data-alert {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            border-radius: var(--radius);
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .card-value.positive { color: var(--success); }
        .card-value.negative { color: var(--danger); }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="nav-tabs">
                <div class="nav-group">
                    <span class="nav-group-label">시장</span>
                    <a href="/market" class="nav-tab">국내</a>
                    <a href="/us-market" class="nav-tab">미국</a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-label">수출</span>
                    <a href="/" class="nav-tab">기업</a>
                    <a href="/industry" class="nav-tab">산업</a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-label">참고 데이터</span>
                    <a href="/carbon" class="nav-tab">탄소배출권</a>
                    <a href="/tourism" class="nav-tab">관광</a>
                    <a href="/headcount" class="nav-tab">인원</a>
                    <a href="/usdc" class="nav-tab">USDC</a>
                    <a href="/deposit-fund" class="nav-tab active">예탁금</a>
                    <a href="/semiconductor-prices" class="nav-tab">반도체가격</a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-label">개별 종목 데이터</span>
                    <a href="/trading-trend" class="nav-tab">매매동향</a>
                    <a href="/quarterly-performance" class="nav-tab">분기실적</a>
                    <a href="/stock-monitor" class="nav-tab">종목주가</a>
                    <a href="/disclosure-compare" class="nav-tab">공시비교</a>
                <a href="/overhang" class="nav-tab">오버행 현황</a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-label">모니터링</span>
                    <a href="/youtube" class="nav-tab">유튜브</a>
                    <a href="/blog" class="nav-tab">블로그</a>
                </div>
                <span class="nav-spacer"></span>
                <a href="/visit" class="nav-tab">탐방</a>
            </div>
            <h1>투자자 예탁금 모니터링</h1>
        </div>
        <p class="subtitle">국내주식 예탁금 일별 추이 및 5년/3년/1년/6개월/3개월/1개월 조회</p>
    </header>

    <main>
        <section id="dummy-alert" class="data-alert" style="display:none;">⚠️ 더미 데이터</section>

        <section class="controls">
            <div class="control-row">
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                    <span style="font-size:0.85rem; color:var(--text-muted); font-weight:600;">조회 기간</span>
                    <button type="button" class="period-btn" data-days="1825">5년</button>
                    <button type="button" class="period-btn" data-days="1095">3년</button>
                    <button type="button" class="period-btn active" data-days="365">1년</button>
                    <button type="button" class="period-btn" data-days="180">6개월</button>
                    <button type="button" class="period-btn" data-days="90">3개월</button>
                    <button type="button" class="period-btn" data-days="30">1개월</button>
                </div>
                <span id="status-msg" style="font-size:0.85rem; color:var(--text-muted);"></span>
            </div>
        </section>

        <section class="summary-cards">
            <div class="card">
                <div class="card-label">현재 예탁금</div>
                <div class="card-value" id="card-current">-</div>
                <div class="card-sub" id="card-current-sub"></div>
            </div>
            <div class="card">
                <div class="card-label">전일 대비</div>
                <div class="card-value" id="card-day">-</div>
                <div class="card-sub" id="card-day-sub"></div>
            </div>
            <div class="card">
                <div class="card-label">1개월 대비</div>
                <div class="card-value" id="card-1m">-</div>
                <div class="card-sub" id="card-1m-sub"></div>
            </div>
            <div class="card">
                <div class="card-label">1년 대비</div>
                <div class="card-value" id="card-1y">-</div>
                <div class="card-sub" id="card-1y-sub"></div>
            </div>
        </section>

        <section class="chart-container">
            <h3>투자자 예탁금 추이</h3>
            <canvas id="deposit-chart"></canvas>
        </section>
    </main>

    <footer>
        <p>데이터 출처: KOFIA FreeSIS (실패 시 더미 데이터 폴백)</p>
    </footer>

    <script src="/static/deposit-fund.js"></script>
</body>
</html>
