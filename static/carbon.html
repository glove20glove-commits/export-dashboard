<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탄소배출권 대시보드</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="nav-tabs">
                <a href="/market" class="nav-tab">시장</a>
                <div class="nav-group">
                    <span class="nav-group-label">수출</span>
                    <a href="/" class="nav-tab">기업</a>
                    <a href="/industry" class="nav-tab">산업</a>
                </div>
                <a href="/carbon" class="nav-tab active">탄소배출권</a>
                <a href="/visit" class="nav-tab">탐방</a>
                <a href="/tourism" class="nav-tab">관광</a>
                <a href="/headcount" class="nav-tab">인원</a>
                <a href="/youtube" class="nav-tab">유튜브</a>
                <a href="/blog" class="nav-tab">블로그</a>
            </div>
            <h1>탄소배출권 대시보드</h1>
        </div>
        <p class="subtitle">KRX 배출권시장 시세 | 공공데이터포털 API</p>
    </header>

    <main>
        <!-- Controls -->
        <section class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label for="item-select">종목 선택</label>
                    <select id="item-select">
                        <option value="KAU25" selected>KAU25 (2025 할당배출권)</option>
                        <option value="KAU24">KAU24 (2024 할당배출권)</option>
                        <option value="KAU23">KAU23 (2023 할당배출권)</option>
                        <option value="KAU26">KAU26 (2026 할당배출권)</option>
                        <option value="KAU27">KAU27 (2027 할당배출권)</option>
                        <option value="KCU25">KCU25 (2025 상쇄배출권)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="period-select">기간</label>
                    <select id="period-select">
                        <option value="30">최근 1개월</option>
                        <option value="90">최근 3개월</option>
                        <option value="180" selected>최근 6개월</option>
                        <option value="365">최근 1년</option>
                        <option value="0">전체</option>
                    </select>
                </div>
                <button id="btn-refresh" class="btn btn-primary">새로고침</button>
            </div>
        </section>

        <!-- Summary Cards -->
        <section class="summary-cards" id="carbon-cards" style="display:none;">
            <div class="card">
                <div class="card-label">현재가</div>
                <div class="card-value" id="card-price">-</div>
                <div class="card-sub" id="card-change">-</div>
            </div>
            <div class="card">
                <div class="card-label">거래량</div>
                <div class="card-value" id="card-volume">-</div>
                <div class="card-sub" id="card-date">-</div>
            </div>
            <div class="card">
                <div class="card-label">최고가 (기간)</div>
                <div class="card-value" id="card-high">-</div>
                <div class="card-sub" id="card-high-date">-</div>
            </div>
            <div class="card">
                <div class="card-label">최저가 (기간)</div>
                <div class="card-value" id="card-low">-</div>
                <div class="card-sub" id="card-low-date">-</div>
            </div>
        </section>

        <!-- Charts -->
        <section class="charts" id="charts-section" style="display:none;">
            <div class="chart-container">
                <h3>배출권 종가 vs 에코아이 주가</h3>
                <canvas id="chart-price"></canvas>
            </div>
            <div class="chart-container">
                <h3>배출권 거래량 vs 에코아이 거래량</h3>
                <canvas id="chart-volume"></canvas>
            </div>
        </section>

        <!-- Data Table -->
        <section class="data-table-section" id="table-section" style="display:none;">
            <h3>일별 상세 데이터</h3>
            <div class="table-wrapper">
                <table id="data-table">
                    <thead>
                        <tr>
                            <th data-sort="date">일자</th>
                            <th data-sort="close">종가(원)</th>
                            <th data-sort="change">전일대비</th>
                            <th data-sort="change_rate">등락률(%)</th>
                            <th data-sort="volume">거래량(톤)</th>
                            <th data-sort="trade_amount">거래대금(원)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>데이터 출처: <a href="https://ets.krx.co.kr" target="_blank">KRX 배출권시장</a> · <a href="https://www.data.go.kr" target="_blank">공공데이터포털</a></p>
    </footer>

    <script src="/static/carbon.js"></script>
</body>
</html>
