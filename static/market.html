<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시장 상관관계 대시보드</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="nav-tabs">
                <a href="/market" class="nav-tab active">시장</a>
                <div class="nav-group">
                    <span class="nav-group-label">수출</span>
                    <a href="/" class="nav-tab">기업</a>
                    <a href="/industry" class="nav-tab">산업</a>
                </div>
                <a href="/carbon" class="nav-tab">탄소배출권</a>
                <a href="/visit" class="nav-tab">탐방</a>
                <a href="/tourism" class="nav-tab">관광</a>
                <a href="/headcount" class="nav-tab">인원</a>
            </div>
            <h1>시장 상관관계</h1>
        </div>
        <p class="subtitle">KOSPI 지수 vs 수출 지표 | 반도체 수출액, 총수출 증감률</p>
    </header>

    <main>
        <!-- Controls -->
        <section>
            <div class="control-row" style="margin-bottom: 12px;">
                <div style="display:flex; gap:8px; align-items:center;">
                    <label>기간:</label>
                    <select id="sel-year-from"></select>
                    <span>~</span>
                    <select id="sel-year-to"></select>
                </div>
                <div style="display:flex; gap:8px; margin-left:auto;">
                    <button id="btn-fetch-kospi" class="btn btn-primary">KOSPI 가져오기</button>
                    <button id="btn-fetch-semi" class="btn btn-secondary">반도체수출 가져오기</button>
                </div>
            </div>
        </section>

        <!-- Correlation Chart -->
        <section>
            <div class="chart-container" style="position:relative; height:450px;">
                <canvas id="correlation-chart"></canvas>
            </div>
        </section>

        <!-- Summary Cards -->
        <section id="summary-cards" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-top:16px;">
        </section>

        <!-- Data Table -->
        <section style="margin-top:20px;">
            <h3>월별 데이터</h3>
            <div class="table-wrapper">
                <table id="data-table">
                    <thead>
                        <tr>
                            <th>년월</th>
                            <th>KOSPI (pt)</th>
                            <th>반도체 수출 (백만불)</th>
                            <th>반도체 증감률 (%)</th>
                            <th>총수출 증감률 (%)</th>
                        </tr>
                    </thead>
                    <tbody id="data-tbody"></tbody>
                </table>
            </div>
        </section>

        <!-- Import Section -->
        <section style="margin-top:20px;">
            <details>
                <summary style="cursor:pointer; color:#6b7280; font-size:14px;">총수출 증감률 수동 입력</summary>
                <div style="margin-top:12px;">
                    <p style="font-size:13px; color:#888; margin-bottom:8px;">
                        산업통상자원부 수출입동향 참조. 형식: 한 줄에 "YYYY-MM,증감률" (예: 2025-01,5.2)
                    </p>
                    <textarea id="import-textarea" rows="6" style="width:100%; font-family:monospace; font-size:13px; padding:8px; border:1px solid #ddd; border-radius:6px;" placeholder="2025-01,5.2&#10;2025-02,-1.3&#10;2025-03,3.1"></textarea>
                    <button id="btn-import" class="btn btn-secondary" style="margin-top:8px;">임포트</button>
                </div>
            </details>
        </section>
    </main>

    <script src="/static/market.js"></script>
</body>
</html>
