<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스테이블코인 유통량 모니터링</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="nav-tabs">
                <div class="nav-group">
                    <span class="nav-group-label">시장</span>
                    <a href="/market" class="nav-tab">국내</a>
                    <a href="/us-market" class="nav-tab">미국</a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-label">수출</span>
                    <a href="/" class="nav-tab">기업</a>
                    <a href="/industry" class="nav-tab">산업</a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-label">참고 데이터</span>
                    <a href="/carbon" class="nav-tab">탄소배출권</a>
                    <a href="/tourism" class="nav-tab">관광</a>
                    <a href="/headcount" class="nav-tab">인원</a>
                    <a href="/usdc" class="nav-tab active">USDC</a>
                    <a href="/semiconductor-prices" class="nav-tab">반도체가격</a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-label">개별 종목 데이터</span>
                    <a href="/trading-trend" class="nav-tab">매매동향</a>
                    <a href="/quarterly-performance" class="nav-tab">분기실적</a>
                    <a href="/stock-monitor" class="nav-tab">종목주가</a>
                    <a href="/disclosure-compare" class="nav-tab">공시비교</a>
                <a href="/overhang" class="nav-tab">오버행 현황</a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-label">모니터링</span>
                    <a href="/youtube" class="nav-tab">유튜브</a>
                    <a href="/blog" class="nav-tab">블로그</a>
                </div>
                <span class="nav-spacer"></span>
                <a href="/visit" class="nav-tab">탐방</a>
            </div>
            <h1>스테이블코인 유통량 모니터링</h1>
        </div>
        <p class="subtitle">USDC · USDT · FDUSD 일별 유통량/시총/가격 비교</p>
    </header>

    <main>
        <section class="controls">
            <div class="control-row">
                <button id="btn-refresh-usdc" class="btn btn-primary">데이터 갱신</button>
                <div style="display:flex; align-items:center; gap:10px;">
                    <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" class="sym-opt" value="USDC" checked> USDC</label>
                    <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" class="sym-opt" value="USDT" checked> USDT</label>
                    <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" class="sym-opt" value="FDUSD" checked> FDUSD</label>
                </div>
                <div style="display:flex; align-items:center; gap:8px; margin-left:auto;">
                    <label for="sel-range">조회 기간</label>
                    <select id="sel-range">
                        <option value="30">1개월</option>
                        <option value="180">6개월</option>
                        <option value="365" selected>1년</option>
                        <option value="0">전체</option>
                    </select>
                </div>
                <span id="usdc-msg" class="hint"></span>
            </div>
        </section>

        <section class="chart-container">
            <h3>스테이블코인 유통량 추이</h3>
            <canvas id="chart-usdc-supply"></canvas>
        </section>

        <section class="table-wrapper desktop-only" style="margin-top:16px;">
            <table id="usdc-table">
                <thead>
                    <tr>
                        <th style="text-align:left;">코인</th>
                        <th style="text-align:left;">기준일</th>
                        <th style="text-align:right;">유통량 (Token)</th>
                        <th style="text-align:right;">7일 변화</th>
                        <th style="text-align:right;">30일 변화</th>
                        <th style="text-align:right;">시가총액 (USD)</th>
                        <th style="text-align:right;">가격 (USD)</th>
                    </tr>
                </thead>
                <tbody id="usdc-tbody"></tbody>
            </table>
        </section>
        <section id="usdc-mobile-cards" class="mobile-only mobile-cards" style="margin-top:12px;"></section>
    </main>

    <footer>
        <p>데이터 출처: <a href="https://coinpaprika.com/" target="_blank">Coinpaprika</a></p>
    </footer>

    <script src="/static/usdc.js"></script>
</body>
</html>
